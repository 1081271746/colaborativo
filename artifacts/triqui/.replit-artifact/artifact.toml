kind = "web"
previewPath = "/"
title = "Triqui"
description = "Juego web de Triqui para dos jugadores en el mismo dispositivo. Incluye turnos, detección de victorias y empates, resaltado de la combinación ganadora, marcador persistente y diseño adaptable."
version = "1.0.0"
id = "artifacts/triqui"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19255

[services.development]
run = "pnpm --filter @workspace/triqui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/triqui", "run", "build" ]
serve = "static"
publicDir = "artifacts/triqui/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19255"
BASE_PATH = "/"
